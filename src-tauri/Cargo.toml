[package]
name = "federwerk"
version = "1.8.0"
description = "Federwerk – Dein digitales Notizbuch (Handschrift, GoodNotes-Import, offline PWA als Desktop- & Android-App)"
authors = ["Federwerk"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "federwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Kleine Binaries bei kaum langsameren Release-Builds:
# - strip: Debug-/Symboltabellen raus (größter Einzelhebel, fast gratis)
# - panic=abort: kein Unwinding-Gerüst (kleiner + etwas schneller)
# - opt-level=z: auf Größe optimieren (Laufzeit für Notiz-App irrelevant)
# Bewusst KEIN lto/codegen-units=1: die würden Linken/Build deutlich
# verlangsamen – Geschwindigkeit kommt stattdessen aus CI-Caching (rust-cache).
[profile.release]
strip = true
panic = "abort"
opt-level = "z"
