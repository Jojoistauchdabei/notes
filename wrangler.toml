# Cloudflare Worker (Static Assets) für Federwerk.
#  Deploy läuft über GitHub Releases (.github/workflows/release.yml) oder über
#  Cloudflare Workers Builds - der zieht office_wasm_bg.wasm und
#  craft_wasm_bg.wasm als Release-Assets, weil sein Runner kein Rust hat.
#  .github/workflows/release.yml baut dist/ frisch (nur öffentliche Dateien,
# ohne .git/tests/Tools, NICHT eingecheckt – siehe .gitignore), hängt
# Federwerk-<tag>-web.zip ans Release und deployed per Wrangler auf den Worker.
# Lokal: erst `npm run build`, dann `wrangler deploy`.
name = "notes"
compatibility_date = "2026-09-11"

[assets]
directory = "dist"
not_found_handling = "single-page-application"
# Ohne das schneidet Cloudflare die Endung ab: /agent.html -> 307 -> /agent ->
# nicht gefunden -> SPA-Fallback, also die App-Shell statt der Doku-Seite.
# "none" holt die Datei wörtlich, ohne Umleitung.
html_handling = "none"
