name: Office-Worker entfernen (einmalig)

# Einmaliger Workflow zum Offline-Nehmen des Workers "office".
# Laeuft die Cloudflare-Secrets des Repos, da lokal kein wrangler-Login
# moeglich ist. Nach dem Lauf wird diese Datei wieder geloescht.

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-teardown
  cancel-in-progress: false

jobs:
  delete:
    name: Worker "office" loeschen
    runs-on: ubuntu-latest
    steps:
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker "office" loeschen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 delete --name office --force || \
            echo "::warning::Worker office konnte nicht geloescht werden (moeglicherweise schon weg)."