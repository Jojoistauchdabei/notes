name: Tauri – Linux / Windows / Android

# Beste Commit-Logik (kein Release pro Commit):
# - Normale Commits auf main → nur CI-Tests, KEIN Build hier.
# - Erst wenn ein GitHub Release veröffentlicht wird (via auto-release.yml:
#   Push mit [release] oder manueller Dispatch → Tag vX.Y.Z + Release),
#   hängt dieser Workflow die nativen Installer an dasselbe Release:
#     Linux: .deb, .AppImage, .rpm (+ Updater-Signaturen)
#     Windows: -setup.exe (NSIS), .msi (+ Updater-Signaturen)
#     Android: universelles .apk (GitHub-Verteilung, kein Play Store)
#   + latest.json für das Desktop-Autoupdate (tauri-plugin-updater).
# - Manuell wiederholbar: Actions → „Tauri" → Run workflow → Tag (z. B. v1.7.2).
# - Wird außerdem von auto-release.yml als wiederverwendbarer Workflow aufgerufen
#   (per GITHUB_TOKEN erstellte Releases lösen sonst keine weiteren Läufe aus).
#
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY – Inhalt von src-tauri/updater-key ( приват-Datei,
#     NIE committen). Public Key steht in src-tauri/tauri.conf.json → plugins.updater.
#     Ohne dieses Secret schlägt der signierte Desktop-Build fehl.
#   CLOUDFLARE_… – nicht nötig hier (Deploy macht release.yml).
# Optional für stabile Android-Updatekette (gleiche Signatur über Releases):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD. Ohne diese Secrets wird ein Debug-APK gebaut
#   (installierbar, aber Updates erfordern ggf. Neuinstallation).

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehender Release-Tag (z. B. v1.7.2) – Installer werden erneut gebaut und hochgeladen'
        required: true
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Bestehender Release-Tag (z. B. v1.7.2)'
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: tauri-${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}

jobs:
  version:
    name: Tag auflösen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Tag bestimmen
        id: v
        run: |
          # TAG kommt aus env (Release-Event, Dispatch-Input oder Call-Input inputs.tag)
          TAG="$TAG"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Ungültiger Tag '$TAG' (erwartet vMAJOR.MINOR.PATCH)."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Version synchronisieren (package.json ↔ tauri.conf.json ↔ Cargo.toml)
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ needs.version.outputs.version }}';
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            console.log('Version auf ' + v + ' synchronisiert');
          "

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Linux-Abhängigkeiten (WebKitGTK u. a.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Web-Frontend bauen
        run: npm run build

      - name: Tauri bauen + an Release hängen (inkl. latest.json für Autoupdate)
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: false
          args: ${{ matrix.args }}

  android:
    name: Android-APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Version synchronisieren
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ needs.version.outputs.version }}';
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          "

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Rust-Ziele für Android + NDK
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.11902868"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902868" >> "$GITHUB_ENV"

      - name: Web-Frontend bauen
        run: npm run build

      - name: Android-Projekt initialisieren (falls neu)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx --yes @tauri-apps/cli android init --ci
          fi

      - name: Keystore vorbereiten (Release-Signatur, falls Secrets vorhanden)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/federwerk.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Android-Keystore-Secrets – es wird ein Debug-APK gebaut (Updates ggf. nur per Neuinstallation)."
          fi

      - name: APK bauen (signiert)
        if: steps.keystore.outputs.signed == 'true'
        env:
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/federwerk.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli android build --apk --ci

      - name: APK bauen (Debug-Fallback)
        if: steps.keystore.outputs.signed != 'true'
        run: npx --yes @tauri-apps/cli android build --apk --debug --ci

      - name: APK einsammeln + umbenennen
        id: apk
        run: |
          V="${{ needs.version.outputs.version }}"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
            OUT="Federwerk-${V}-universal.apk"
          else
            SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
            OUT="Federwerk-${V}-universal-debug.apk"
          fi
          test -n "$SRC" || { echo "::error::Kein APK gefunden."; exit 1; }
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: APK an Release hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" "${{ steps.apk.outputs.apk }}" --clobber
