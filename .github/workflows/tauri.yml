name: Tauri – Linux / Windows / Android

# Release-Logik: Dieser Workflow hängt Installer an ein bestehendes Release –
# ausgelöst durch ein veröffentlichtes Release, manuell per Dispatch oder als
# wiederverwendbarer Workflow von auto-release.yml (per GITHUB_TOKEN erstellte
# Releases lösen sonst keine weiteren Läufe aus; jeder Main-Push erzeugt eins):
#     Linux: .deb, .AppImage, .rpm (+ Updater-Signaturen)
#     Windows: -setup.exe (NSIS), .msi (+ Updater-Signaturen)
#     Android: APKs pro ABI (arm64/arm/x86_64/x86, GitHub-Verteilung, kein
#       Play Store – kein 600MB-Universal-APK mehr, jedes Gerät lädt nur
#       seine Architektur) (+ Debug-Variante ohne Keystore-Secrets)
#   + latest.json für das Desktop-Autoupdate (tauri-plugin-updater).
# - Manuell wiederholbar: Actions → „Tauri" → Run workflow → Tag (z. B. v1.7.2).
# - Wird außerdem von auto-release.yml als wiederverwendbarer Workflow aufgerufen
#   (per GITHUB_TOKEN erstellte Releases lösen sonst keine weiteren Läufe aus).
#
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY – Inhalt von src-tauri/updater-key ( приват-Datei,
#     NIE committen). Public Key steht in src-tauri/tauri.conf.json → plugins.updater.
#     Ohne dieses Secret schlägt der signierte Desktop-Build fehl.
#   CLOUDFLARE_… – nicht nötig hier (Deploy macht release.yml).
# Optional für stabile Android-Updatekette (gleiche Signatur über Releases):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD. Ohne diese Secrets wird ein Debug-APK gebaut
#   (installierbar, aber Updates erfordern ggf. Neuinstallation).

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'EXISTIERENDER Release-Tag (z. B. v1.7.8) – Installer werden erneut gebaut und hochgeladen'
        required: true
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Bestehender Release-Tag (z. B. v1.7.2)'
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: write

concurrency:
  group: tauri-${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}

jobs:
  version:
    name: Tag auflösen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Code holen (für Tag-Prüfung)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag bestimmen und prüfen
        id: v
        run: |
          # TAG kommt aus env (Release-Event, Dispatch-Input oder Call-Input inputs.tag)
          TAG="$TAG"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Ungültiger Tag '$TAG' (erwartet vMAJOR.MINOR.PATCH, z. B. v1.7.8)."; exit 1; }
          git fetch --tags origin
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::Tag '$TAG' existiert nicht – vorhandenen Tag wählen (z. B. den neuesten aus der Release-Liste)."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      # Einheitlich via Skript (kein Inline-JS → kein PowerShell-Quoting-Problem)
      - name: Version synchronisieren (package.json ↔ Manifest ↔ Tauri ↔ Cargo)
        shell: bash
        run: npm run sync-version

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      # Cargo-Registry + Target-Cache: spart pro Lauf den kompletten
      # Rebuild von Tauri/Plugins (größter Zeitfresser im Desktop-Job).
      - name: Rust-Build-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux-Abhängigkeiten (WebKitGTK u. a.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Web-Frontend bauen + Version stempeln
        run: npm run release-web

      # Signatur-Format prüfen (gibt NICHTS vom Schlüssel aus – nur Formcheck),
      # damit ein unvollständig eingefügtes Secret sofort auffällt.
      # Format: Die Schlüsseldatei ist ein Base64-Blob, der ein Minisign-
      # Secret-Key-Paket enthält (siehe tauri-cli signer).
      - name: Signierschlüssel prüfen (nur Formcheck, kein Inhalt im Log)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ist leer (Repo → Settings → Secrets → Actions)."; exit 1; }
          DECODED="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null)" \
            || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY ist kein gültiges Base64 – Datei src-tauri/updater-key vollständig (beide Zeilen, ohne Umbruch-Fehler) einfügen."; exit 1; }
          printf '%s' "$DECODED" | grep -q '^untrusted comment:' \
            || { echo "::error::Secret enthält kein Minisign-Format – falscher Inhalt im Secret?"; exit 1; }
          LEN=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | wc -c)
          echo "Signierschlüssel-Format OK ($LEN Zeichen, Inhalt nicht angezeigt)."

      - name: Tauri bauen + an Release hängen (inkl. latest.json für Autoupdate)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: false

  android:
    name: Android-APK
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Version synchronisieren (package.json ↔ Manifest ↔ Tauri ↔ Cargo)
        run: npm run sync-version

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Keine SDK-Fremd-Action: Das SDK liegt auf ubuntu-Runnern vorinstalliert
      # vor (ANDROID_SDK_ROOT) – direkt prüfen + benötigte Pakete nachinstallieren.
      - name: Android-SDK prüfen (vorinstalliert)
        run: |
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          test -n "$ANDROID_HOME" || { echo "::error::Kein Android-SDK auf dem Runner gefunden."; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"
          echo "--- SDK-Inhalt ---"
          ls "$ANDROID_HOME/cmdline-tools"
          which sdkmanager java

      # Rust inkl. Android-Ziele über die Toolchain-Action (gecacht) statt
      # manuellem Neuaufsetzen der Toolchain bei jedem Lauf.
      - name: Rust einrichten (mit Android-Zielen)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Cargo-Registry + Target-Cache (eigener Key, kein Mix mit Desktop):
      # spart den kompletten Rebuild der 4 Android-Targets pro Lauf.
      - name: Rust-Build-Cache (Android)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android

      - name: Android-Plattform + NDK bereitstellen
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          if [ -n "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            NDK_VER="$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
            echo "Vorinstalliertes NDK: $NDK_VER"
          else
            sdkmanager "ndk;28.2.13676358"
            NDK_VER="28.2.13676358"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Web-Frontend bauen + Version stempeln
        run: npm run release-web

      - name: Android-Projekt initialisieren (falls neu)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx --yes @tauri-apps/cli android init --ci
          fi

      # WICHTIG: `android init` erzeugt ein frisches gen-Projekt mit den
      # Tauri-Standard-Icons. `tauri icon` schreibt unsere Federwerk-Icons aus
      # src-tauri/icons/icon.png danach ins gen-Projekt
      # (src-tauri/gen/android/.../res/mipmap-*/...), sonst trägt das APK das
      # Tauri-Logo statt unseres Logos.
      - name: App-Icons ins Android-Projekt übernehmen (statt Tauri-Standard)
        run: |
          npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png
          # Adaptive-Icon-Hintergrund auf Marken-Dunkelbraun setzen (Ecken des
          # Foregrounds sind transparent; `tauri icon` setzt hier sonst #fff,
          # was weiße Ecken um das dunkle Icon gäbe).
          BG='<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#2a1a0e</color></resources>'
          printf '%s' "$BG" > src-tauri/icons/android/values/ic_launcher_background.xml
          GEN_BG='src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml'
          if [ -f "$GEN_BG" ]; then printf '%s' "$BG" > "$GEN_BG"; fi

      - name: Keystore vorbereiten (Release-Signatur, falls Secrets vorhanden)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/federwerk.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Android-Keystore-Secrets – es wird ein Debug-APK gebaut (Updates ggf. nur per Neuinstallation)."
          fi

      # --split-per-abi: ein kleines APK pro Architektur statt einem
      # fetten Universal-APK (enthält sonst alle 4 Nativ-Libs).
      - name: APKs bauen (signiert, pro ABI)
        if: steps.keystore.outputs.signed == 'true'
        env:
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/federwerk.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli android build --apk --split-per-abi --ci

      - name: APKs bauen (Debug-Fallback, pro ABI)
        if: steps.keystore.outputs.signed != 'true'
        run: npx --yes @tauri-apps/cli android build --apk --debug --split-per-abi --ci

      - name: APKs einsammeln + umbenennen
        id: apk
        run: |
          V="${{ needs.version.outputs.version }}"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then MODE="release"; else MODE="debug"; fi
          FILES=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | sort)
          test -n "$FILES" || { echo "::error::Kein APK gefunden."; exit 1; }
          OUTS=""
          for SRC in $FILES; do
            abi=$(basename "$SRC" .apk | cut -d- -f2)
            [ -n "$abi" ] || abi="universal"
            OUT="Federwerk-${V}-${abi}-${MODE}.apk"
            cp "$SRC" "$OUT"
            OUTS="$OUTS $OUT"
          done
          echo "apks=$OUTS" >> "$GITHUB_OUTPUT"
          ls -la $OUTS

      - name: APKs an Release hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" ${{ steps.apk.outputs.apks }} --clobber
