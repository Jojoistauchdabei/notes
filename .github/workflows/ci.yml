name: CI – Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node ${{ matrix.node }} einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tests laufen lassen
        run: npm test
