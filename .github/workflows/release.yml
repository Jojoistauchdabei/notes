name: Release – Test + Web-ZIP + Cloudflare Deploy

# Läuft, wenn ein GitHub Release veröffentlicht wird:
# 1. Tests (müssen grün sein, sonst kein Deploy)
# 2. dist/ frisch bauen (wird NICHT eingecheckt, siehe .gitignore) →
#    Federwerk-<tag>-web.zip ans Release hängen (fertige Cloudflare-Dateien:
#    entpacken und z. B. per `wrangler deploy` mit assets-Verzeichnis nutzen)
# 3. Deploy des Release-Tags per Wrangler auf den Cloudflare Worker
# Die nativen Installer (deb/AppImage/rpm/Windows/APK + latest.json) hängt
# parallel .github/workflows/tauri.yml an dasselbe Release.
# Benötigte Repo-Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – Token mit Berechtigung „Workers Scripts: Edit“
#   CLOUDFLARE_ACCOUNT_ID – Account-ID (Cloudflare Dashboard, rechte Seitenleiste)

"on":
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Tests (Pflicht vor Deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests laufen lassen
        run: npm test

  deploy:
    name: Web-ZIP + Deploy auf Cloudflare
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Secrets prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Deploy-Verzeichnis bauen (nur öffentliche Dateien, nicht eingecheckt)
        run: npm run build

      - name: Web-ZIP bauen + an Release hängen (Cloudflare-Dateien)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ZIP="Federwerk-${TAG}-web.zip"
          python3 -c "import shutil; shutil.make_archive('Federwerk-${TAG}-web', 'zip', root_dir='dist')"
          python3 -m zipfile -l "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber

      - name: Auf Cloudflare deployen (wrangler.toml → Worker „notes", wrangler@4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
