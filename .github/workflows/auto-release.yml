name: Auto-Release – Test + Release + Deploy

# Release-Automation (Alternative zum manuellen Release im Web-UI):
# - Manuell: Actions → „Auto-Release" → Run workflow → Version (z. B. v1.7.0)
# - Automatisch: JEDER Push auf main legt ein Release an. Die Version kommt
#   aus package.json; existiert der Tag bereits, wird Patch automatisch
#   hochgezählt (v1.7.2 → v1.7.3 …), bis der Tag frei ist. Für Minor/Major
#   die Version vorher in package.json erhöhen (+ `npm run sync-version`).
# - Opt-out: Commit-Message mit „[skip release]" oder „[no release]".
# Ablauf: Tests (Pflicht, sonst Stopp) → Tag + GitHub Release → Web-ZIP → Deploy
# → Tauri-Installer (als wiederverwendbarer Workflow im selben Lauf).
# Bei manuell (Web-UI) erstellten Releases laufen automatisch:
# - release.yml: baut dist/ frisch (nicht eingecheckt), hängt
#   Federwerk-<tag>-web.zip ans Release und deployed auf Cloudflare.
# - tauri.yml: hängt Linux- (deb/AppImage/rpm), Windows- und Android-Installer
#   + latest.json (Desktop-Autoupdate) an dasselbe Release.
# Hinweis: Ein per GITHUB_TOKEN erstelltes Release startet KEINE weiteren
# Workflow-Läufe (GitHub unterdrückt Workflow-Ketten) – darum passieren
# Web-ZIP, Deploy und Tauri-Builds für diesen Weg direkt hier im selben Lauf.

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version als Tag (Format vMAJOR.MINOR.PATCH, z. B. v1.7.0)'
        required: true
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Test + Release + Deploy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Release-Tag auschecken (mit Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prüfen ob ein Release gewünscht ist
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${{ github.event.head_commit.message }}" | grep -qiE '\[skip release\]|\[no release\]'; then
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            echo "[skip release] in der Commit-Message – kein Release, Workflow endet hier."
          else
            echo "wanted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version bestimmen und prüfen
        if: steps.gate.outputs.wanted == 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::Ungültige Version '$VERSION' (erwartet vMAJOR.MINOR.PATCH, z. B. v1.7.0)."; exit 1; }
            git fetch --tags origin
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "::error::Tag $VERSION existiert bereits – andere Version wählen."
              exit 1
            fi
          else
            git fetch --tags origin
            VERSION="v$(node -p "require('./package.json').version")"
            echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::Ungültige Version '$VERSION' in package.json (erwartet MAJOR.MINOR.PATCH)."; exit 1; }
            # Tag belegt? → Patch hochzählen, bis der Tag frei ist.
            i=0
            while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
              VERSION="$(VERSION="$VERSION" node -e "const v=process.env.VERSION.slice(1).split('.').map(Number); v[2]++; console.log('v'+v.join('.'))")"
              i=$((i+1))
              [ "$i" -lt 100 ] || { echo "::error::Kein freier Patch-Tag in Reichweite gefunden."; exit 1; }
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release-Version: $VERSION"

      - name: Node einrichten
        if: steps.gate.outputs.wanted == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests laufen lassen (Pflicht vor Release)
        if: steps.gate.outputs.wanted == 'true'
        run: npm test

      - name: Tag + GitHub Release anlegen
        if: steps.gate.outputs.wanted == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "$GITHUB_SHA"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Secrets prüfen
        if: steps.gate.outputs.wanted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Deploy-Verzeichnis bauen (nur öffentliche Dateien, nicht eingecheckt)
        if: steps.gate.outputs.wanted == 'true'
        run: npm run build

      - name: Auf Cloudflare deployen (wrangler.toml → Worker „notes", wrangler@4)
        if: steps.gate.outputs.wanted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Web-ZIP bauen + an Release hängen (Cloudflare-Dateien, dist/ ist nicht eingecheckt)
        if: steps.gate.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="Federwerk-${VERSION}-web.zip"
          python3 -c "import shutil; shutil.make_archive('Federwerk-${VERSION}-web', 'zip', root_dir='dist')"
          python3 -m zipfile -l "$ZIP"
          gh release upload "$VERSION" "$ZIP" --clobber

  tauri-installers:
    name: Linux / Windows / Android (Tauri)
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/tauri.yml
    with:
      tag: ${{ needs.release.outputs.version }}
    secrets: inherit
