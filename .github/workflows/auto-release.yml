name: Auto-Release – Test + Release + Deploy

# Release-Automation (Alternative zum manuellen Release im Web-UI):
# - Manuell: Actions → „Auto-Release" → Run workflow → Version (z. B. v1.7.0)
# - Automatisch: Push auf main mit „[release]" in der Commit-Message.
#   Die Version kommt aus package.json – vor dem Push dort erhöhen,
#   sonst bricht der Workflow ab (Tag existiert bereits).
# Ablauf: Tests (Pflicht, sonst Stopp) → Tag + GitHub Release → dist/ → Deploy.
# Hinweis: Der Release wird mit GITHUB_TOKEN erstellt, daher startet
# release.yml NICHT zusätzlich (GitHub unterdrückt Workflow-Ketten) –
# der Deploy passiert direkt hier, keine Doppel-Deploy-Gefahr.

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version als Tag (Format vMAJOR.MINOR.PATCH, z. B. v1.7.0)'
        required: true
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Test + Release + Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken (mit Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prüfen ob ein Release gewünscht ist
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[release\]'; then
            echo "wanted=true" >> "$GITHUB_OUTPUT"
          else
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            echo "Kein [release] in der Commit-Message – kein Release, Workflow endet hier."
          fi

      - name: Version bestimmen und prüfen
        if: steps.gate.outputs.wanted == 'true'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Ungültige Version '$VERSION' (erwartet vMAJOR.MINOR.PATCH, z. B. v1.7.0)."; exit 1; }
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION existiert bereits – package.json-Version erhöhen oder andere Version wählen."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release-Version: $VERSION"

      - name: Node einrichten
        if: steps.gate.outputs.wanted == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests laufen lassen (Pflicht vor Release)
        if: steps.gate.outputs.wanted == 'true'
        run: npm test

      - name: Tag + GitHub Release anlegen
        if: steps.gate.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Secrets prüfen
        if: steps.gate.outputs.wanted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }

      - name: Deploy-Verzeichnis bauen (nur öffentliche Dateien)
        if: steps.gate.outputs.wanted == 'true'
        run: |
          rm -rf dist && mkdir -p dist
          cp index.html manifest.webmanifest sw.js altes_Papier.png dist/
          cp -r css js icons screenshots dist/
          echo "--- dist-Inhalt ---"
          find dist -type f | sort

      - name: Auf Cloudflare deployen (wrangler.toml → Worker „notes", wrangler@4)
        if: steps.gate.outputs.wanted == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
