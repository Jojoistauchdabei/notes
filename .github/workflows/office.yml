name: Office – Web-Deploy

# Release-Logik für die Office-App. Hängt die fertigen Cloudflare-Dateien an
# ein bestehendes Release und deployed auf einen EIGENEN Worker ("office"),
# getrennt vom Federwerk-Worker "notes".
#
# Warum ein eigener Worker (siehe office/wrangler.toml):
# - Der ONLYOFFICE-WASM-Editor ist AGPL-3.0 mit erwaehnungspflichtigen
#   Zusatzbedingungen. Solange kein ONLYOFFICE-Code in Federwerks dist/ landet,
#   bleibt Federwerk davon unberuehrt.
# - ~445 MB Editor-Rohdaten und Hunderte Dateien gehoeren nicht in
#   Federwerks Web-ZIP und nicht in die Desktop-/Android-Installer.
# - Getrennte Deployments: ein Office-Fehler rollt das Federwerk-Deployment
#   nicht zurück (eigener Job, kein `needs`).
#
# Ausgelöst durch ein veröffentlichtes Release, manuell per Dispatch oder als
# wiederverwendbarer Workflow von auto-release.yml (per GITHUB_TOKEN erstellte
# Releases lösen sonst keine weiteren Läufe aus).
#
# Benötigte Repo-Secrets – dieselben wie für release.yml:
#   CLOUDFLARE_API_TOKEN – Token mit Berechtigung "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID
# Zusätzlich nötig: der Worker muss im Ziel-Account einmalig angelegt sein
# (sonst legt wrangler ihn beim ersten Deploy selbst an).

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'EXISTIERENDER Release-Tag (z. B. v1.9.9) – Office-Deploy wird wiederholt'
        required: true
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Bestehender Release-Tag (z. B. v1.9.9)'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: write

concurrency:
  group: office-${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Office bauen + auf Worker „office" deployen
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secrets prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID fehlt (Repo → Settings → Secrets and variables → Actions)."; exit 1; }

      - name: office/dist bauen (nicht eingecheckt)
        run: npm run build:office

      - name: Office-ZIP an Release hängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag || inputs.tag }}"
          ZIP="Office-${TAG}-web.zip"
          python3 -c "import shutil; shutil.make_archive('Office-${TAG}-web', 'zip', root_dir='office/dist')"
          python3 -m zipfile -l "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber

      - name: Auf Cloudflare deployen (office/wrangler.toml → Worker „office", wrangler@4)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config office/wrangler.toml
