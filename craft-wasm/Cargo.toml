[package]
name = "federwerk-craft-wasm"
version = "0.1.0"
edition = "2021"
description = "PSD/SVG/IDML-Bridge fuer Federwerk (ArtCraft-Engines: PhotoCraft, VectorCraft, DesignCraft)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "3", default-features = false, features = ["deflate"] }

# Upstream-Engines, gepinnt auf einen Commit, nicht auf crates.io.
#
# Nur die Format-Crates, nicht die Oberflaege: crates/ui-egui, crates/gpu,
# crates/plugins und die Codec-Sammlungen (filmcraft/effectcraft/lightcraft)
# bleiben draussen. Das ist derselbe Hebel wie beim Office-WASM: der fertige
# Web-Build von photocraft wiegt 10,6 MB, weil dort alles mitkompiliert wird.
photocraft-psd = { git = "https://github.com/storytold/photocraft.git", rev = "11f6f00ccc888cb12caa95ab70dcadc231fda90f", features = ["serde"] }
vectorcraft-svg = { git = "https://github.com/storytold/vectorcraft.git", rev = "e2a41733375afa75adbc519472dd67802382eb8b" }
vectorcraft-doc = { git = "https://github.com/storytold/vectorcraft.git", rev = "e2a41733375afa75adbc519472dd67802382eb8b" }
designcraft-idml = { git = "https://github.com/storytold/designcraft.git", rev = "f4a4c9709b7c552800f15ba3d1f0f68dd75fa165" }
designcraft-doc = { git = "https://github.com/storytold/designcraft.git", rev = "f4a4c9709b7c552800f15ba3d1f0f68dd75fa165" }

[profile.release]
# Wie beim Office-WASM: opt-level="z" + LTO + strip ist der Groessenhebel.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true